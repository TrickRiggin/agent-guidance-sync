name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  powershell:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run module tests
        shell: pwsh
        run: ./tests/Test-AgentGuidanceSync.ps1
